

<!DOCTYPE html>

<html lang="ar" dir="rtl">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>رسالة خاصة</title>

<style>

* {

  box-sizing: border-box;

}

body {

  margin: 0;

  min-height: 100vh;

  display: flex;

  justify-content: center;

  align-items: center;

  background: #080808;

  font-family: Tahoma, Arial, sans-serif;

  color: white;

}

.card {

  width: 90%;

  max-width: 350px;

  padding: 35px 22px;

  text-align: center;

  background: #171717;

  border: 1px solid #333;

  border-radius: 22px;

  box-shadow: 0 0 25px #222;

}

h1 {

  font-size: 24px;

  margin-bottom: 12px;

}

p {

  color: #aaa;

  font-size: 14px;

}

button {

  width: 100%;

  padding: 14px;

  margin-top: 18px;

  border: none;

  border-radius: 12px;

  background: white;

  color: black;

  font-size: 16px;

  font-weight: bold;

  cursor: pointer;

}

#message {

  display: none;

  margin-top: 25px;

  font-size: 23px;

  font-weight: bold;

  color: #ff5252;

  animation: appear 0.5s ease;

}

@keyframes appear {

  from {

    opacity: 0;

    transform: scale(0.7);

  }

  to {

    opacity: 1;

    transform: scale(1);

  }

}

</style>

</head>

<body>

<div class="card">

  <h1>عندك رسالة خاصة 👀</h1>

  <p>اضغط الزر عشان تشوف المفاجأة</p>

  <button onclick="openMessage()">

    افتح الرسالة

  </button>

  <div id="message"></div>

</div>

<script>

function openMessage() {

  const message = document.getElementById("message");

  message.textContent = "دخلت حسابك يا هطف 😂";

  message.style.display = "block";

}

</script>

</body>

</html>
